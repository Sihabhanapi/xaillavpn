name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Xray-core (arm64 + armv7)
        run: |
          V=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "Versi Xray: $V"
          J=app/src/main/jniLibs; mkdir -p $J/arm64-v8a $J/armeabi-v7a t
          B=https://github.com/XTLS/Xray-core/releases/download/$V
          curl -fsSL $B/Xray-linux-arm64-v8a.zip -o t/a.zip
          curl -fsSL $B/Xray-linux-arm32-v7a.zip -o t/b.zip
          unzip -oj t/a.zip xray -d t/a && cp t/a/xray $J/arm64-v8a/libxray.so
          unzip -oj t/b.zip xray -d t/b && cp t/b/xray $J/armeabi-v7a/libxray.so
          chmod +x $J/*/libxray.so

      - name: hev-socks5-tunnel (tun2socks)
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel hev
          if [ -f hev/Android.mk ]; then
            echo "Pakai Android.mk bawaan hev"
            SCRIPT=$PWD/hev/Android.mk
          else
            echo "Android.mk bawaan tidak ada, pakai buatan sendiri"
            mkdir -p jni && cp -r hev/. jni/hev-socks5-tunnel/ 2>/dev/null || true
            echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
            SCRIPT=$PWD/jni/Android.mk
          fi
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=$PWD APP_BUILD_SCRIPT=$SCRIPT \
            "APP_ABI=armeabi-v7a arm64-v8a" APP_PLATFORM=android-24 NDK_LIBS_OUT=$PWD/libs
          NM=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          for a in arm64-v8a armeabi-v7a; do
            f=libs/$a/libhev-socks5-tunnel.so
            echo "Cek simbol di $a:"
            $NM -D $f | grep -E "JNI_OnLoad|TProxyStartService|TProxyStopService" \
              || { echo "SIMBOL JNI TIDAK ADA di $a"; exit 1; }
            mkdir -p app/src/main/jniLibs/$a
            cp $f app/src/main/jniLibs/$a/
          done

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleRelease --no-daemon

      - name: Ambil APK armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: xaillavpn-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk

      - name: Ambil APK arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: xaillavpn-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
